<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Communication Interface</title>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/default.min.css">
<style>
body {
display: flex;
font-family: Arial, sans-serif;
background-color: #8f8f8f;
margin: 0;
padding: 0;
height: 100vh;
overflow: hidden;
}
#main-container {
display: flex;
width: 100%;
height: 100%;
}
#history-sidebar {
width: 250px;
padding: 20px;
border-right: 1px solid #3e3e3e;
display: none;
overflow-y: auto;
box-sizing: border-box;
}
#main-content {
flex: 1;
padding: 20px;
overflow-y: auto;
box-sizing: border-box;
}
#settings-sidebar {
width: 250px;
padding: 20px;
border-left: 1px solid #3e3e3e;
display: none;
overflow-y: auto;
box-sizing: border-box;
}
.accordion { margin-bottom: 20px; background-color: #6a737d; color: white; }
.filter-bar { margin-bottom: 20px; }
.column { display: inline-block; vertical-align: top; margin-right: 20px; width: 30%; }
.menu-option { display: inline-block; margin: 5px; padding: 5px 10px; border: 1px solid #2e2e2e; border-radius: 15px; cursor: pointer; color: white; background-color: #555555; }
#user-input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
#send-button { margin-top: 10px; }
.annotation-menu { display: none; position: absolute; background: #636363; border: 1px solid #636363; padding: 10px; }
.sidebar-toggle { cursor: pointer; padding: 5px 10px; background-color: #636363; border: 1px solid #636363; margin-bottom: 10px; color: white; }
.close-btn { position: absolute; top: -4px; right: -4px; cursor: pointer; background-color: transparent; border: none; color: white; font-size: 16px; }
pre { background-color: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto; max-width: 100%; }
code { font-family: 'Courier New', Courier, monospace; }
.message { max-width: 100%; word-wrap: break-word; }
.column-container { display: flex; flex-wrap: wrap; }
.auto-open-checkbox {
margin-top: 10px;
color: white;
}
</style>
</head>
<body>
<div id="main-container">
    <div id="history-sidebar">
        <div class="sidebar-toggle" id="toggle-history">Hide History</div>
        <div id="history-accordion" class="accordion">
            <h3>History</h3>
            <div>
                <p>History is empty</p>
            </div>
        </div>
        <a href="#" id="refresh-history">Refresh History</a>
    </div>

    <div id="main-content">
        <div class="sidebar-toggle" id="toggle-history-main">Show History</div>
        <div class="sidebar-toggle" id="toggle-settings-main">Show Settings</div>
      <div class="auto-open-checkbox">
            <input type="checkbox" id="auto-open-accordion" checked>
            <label for="auto-open-accordion">Auto-focus new messages</label>
        </div>
        <div class="filter-bar">
            <select id="filter-message-type">
                <option value="all">All Message Types</option>
            </select>
            <select id="filter-agent-type">
                <option value="all">All Agent Types</option>
            </select>
            <input type="text" id="search-filter" placeholder="Search...">
        </div>

        <div id="message-accordion" class="accordion"></div>

        <div id="menu-options"></div>

        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>

        <div class="filter-bar-bottom">
            <select id="filter-message-type-bottom">
                <option value="all">All Message Types</option>
            </select>
            <select id="filter-agent-type-bottom">
                <option value="all">All Agent Types</option>
            </select>
            <input type="text" id="search-filter-bottom" placeholder="Search...">
        </div>
    </div>

    <div id="settings-sidebar">
        <div class="sidebar-toggle" id="toggle-settings">Hide Settings</div>
        <h3>Settings</h3>
        <center>
            <label for="default-llm">Default LLM:</label><br><br>
            <select id="default-llm">
                <option value="0">GPT-3.5</option>
                <option value="1">GPT-4</option>
                <option value="2">Sonnet 3.5</option>
            </select><br><br><br>

            <label for="premium-llm">Premium LLM:</label><br><br>
            <select id="premium-llm">
                <option value="0">GPT-4</option>
                <option value="1">Sonnet 3.5</option>
            </select><br><br><br>

            <label for="temperature">Temperature:</label><br><br>
            <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.5"><br><br><br>

            <button id="apply-settings">Apply Settings</button>
        </center>
    </div>
</div>

<div class="annotation-menu">
    <button class="close-btn">&times;</button>
    <select id="annotation-scope">
        <option value="span">Selected Text</option>
        <option value="lines">Selected Lines</option>
        <option value="full">Full Last Answer</option>
    </select>
    <select id="annotation-action">
        <option value="approve">Approve : Highlight good things</option>
        <option value="fix">Fix : Indicate what to correct or improve</option>
        <option value="delete">Delete : Explain why</option>
        <option value="variants">Variants : Ask to generate some good equivalents</option>
    </select>
    <input type="text" id="annotation-input" placeholder="Enter your annotation">
    <button id="apply-annotation">Apply</button>
</div>

<script>
$(function() {
let socket = new WebSocket('ws://localhost:6789');
let currentAgent = '';
let savedSelection = null;

socket.onopen = function() {
console.log('WebSocket connection established');
};

socket.onmessage = function(event) {
let data = JSON.parse(event.data);
displayMessage(data);
};

socket.onclose = function() {
console.log('WebSocket connection closed');
};

function displayMessage(data) {
        let title = `${data.agent_name} | ${data.message_type} | ${new Date().toLocaleTimeString()}`;
        if(data.message_type ===null)
        {title = `${data.agent_name} | ${new Date().toLocaleTimeString()}`;
        }
        let content = `<div class='message'>${formatMessage(data.message)}</div>`;

        let $agentAccordion = $(`#message-accordion > div[data-agent="${data.agent_name}"]`);
        if ($agentAccordion.length === 0) {
            $agentAccordion = $(`<div data-agent="${data.agent_name}"><h3>${data.agent_name}</h3><div></div></div>`);
            $("#message-accordion").append($agentAccordion);
        }

        let $messageContainer = $(`<h4>${title}</h4><div class="column-container">${content}</div>`);
        $agentAccordion.children("div").append($messageContainer);

        if (data.message_type === 'column') {
            displayInColumn(data, $messageContainer.find('.column-container'));
        }

        if (data.input) {
            displayInputField();
        }

        if (data.message.includes("BEFORE") || data.message.includes("AFTER")) {
            displayMenuOptions(data.message);
        }

        $("#message-accordion").accordion("refresh");
        updateFilters(data);

        // Apply syntax highlighting to code blocks
        $('pre code').each(function(i, block) {
            hljs.highlightBlock(block);
        });

        // Auto-open accordion if checkbox is checked
        if ($("#auto-open-accordion").is(":checked")) {
            let accordionIndex = $("#message-accordion > div").index($agentAccordion);
            $("#message-accordion").accordion("option", "active", accordionIndex);
            // Wait a second then scroll to the bottom
            setTimeout(scrollToBottom, 1000);
        }
    }

 function scrollToBottom() {
        let mainContent = document.getElementById('main-content');
        mainContent.scrollTop = mainContent.scrollHeight;
    }

    $("#auto-open-accordion").change(function() {
        if ($(this).is(":checked")) {
            scrollToBottom();
        }
    });


    function displayInColumn(data, $columnContainer) {
        let $column = $(`
            <div class="column" data-column-id="${data.column_id}">
                <h4>${data.agent_name} | ${data.message_type}</h4>
                <div>${data.message}</div>
                <button class="regenerate">Regenerate</button>
                <button class="delete">Delete</button>
                <button class="open-vscode">Open in VSCode</button>
            </div>
        `);
        $columnContainer.append($column);
    }

            function formatMessage(message) {
                // Regular expression to match Python code blocks
                const codeBlockRegex = /```python\n([\s\S]*?)```/g;

                // Replace code blocks with pretty-printed versions
                let formattedMessage = message.replace(codeBlockRegex, function(match, code) {
                    return `<pre><code class="python">${code}</code></pre>`;
                });

                // Replace '\n' with '<br>' for line breaks
                formattedMessage = formattedMessage.replace(/\n/g, '<br>');

                return `<div class="message">${formattedMessage}</div>`;
            }

            function displayInputField() {
                $("#user-input").show();
                $("#send-button").show();
            }

            function displayMenuOptions(message) {
                $("#menu-options").empty();
                let options = message.split('\n').filter(line => line.startsWith('['));
                options.forEach(option => {
                    let match = option.match(/\[(.)\](.*)/);
                    letter = match[1].toUpperCase();
                    // Si la ligne contient le mot "Change" on l'ignore
                    if (match && !match[2].includes("Change default") && !match[2].includes("Change premium") && !match[2].includes("Exit") && !match[2].includes("Log comments")){
                        let $option = $(`<div class="menu-option" data-option="${match[1]}">${match[2]}</div>`);
                        $("#menu-options").append($option);
                    }
                });
            }

            function updateFilters(data) {
                if (!$("#filter-message-type option[value='" + data.message_type + "']").length) {
                    $("#filter-message-type, #filter-message-type-bottom").append(new Option(data.message_type, data.message_type));
                }
                if (!$("#filter-agent-type option[value='" + data.agent_name + "']").length) {
                    $("#filter-agent-type, #filter-agent-type-bottom").append(new Option(data.agent_name, data.agent_name));
                }
            }

            $("#message-accordion").accordion({
                header: "> div > h3",
                collapsible: true,
                active: false,
                heightStyle: "content"
            });

            $("#history-accordion").accordion({
                collapsible: true,
                active: false,
                heightStyle: "content"
            });

            $("#send-button").click(function() {
            sendMessage();
        });

        // Add this new event listener for the Enter key
        $("#user-input").keypress(function(e) {
            if (e.which == 13) { // 13 is the Enter key code
                e.preventDefault(); // Prevent default Enter key behavior
                sendMessage();
            }
        });

        // Create a new function to handle sending messages
        function sendMessage() {
            let message = $("#user-input").val();
            if (message) {
                socket.send(JSON.stringify({ message: message }));
                $("#user-input").val('');
            }
        }

            $("#refresh-history").click(function(e) {
    e.preventDefault();
    $.ajax({
        url: "http://127.0.0.1:5000/api/history",
        type: "GET",
        dataType: 'text',
        success: function(data) {
            $("#history-accordion").empty();
            console.log("Received raw data:", data);

            try {
                let historyContent = JSON.parse(data);
                let contentHtml = '';
                console.log("Received JSON data:", historyContent);

                if (Object.keys(historyContent).length === 0) {
                    contentHtml = '<h3>History</h3><div><p>History is empty</p></div>';
                } else {
                    // Get all entries and filter for those with more than 0 characters
                    let filteredEntries = Object.entries(historyContent).filter(([key, value]) => {
                        return JSON.stringify(value).length > 0;
                    });

                    // Sort filtered entries by date (assuming the key is a date string)
                    let sortedEntries = filteredEntries.sort((a, b) => new Date(a[0]) - new Date(b[0]));

                    // Group entries by first letter
                    let groupedEntries = {};
                    for (const [key, value] of sortedEntries) {
                        let firstLetter = key[0].toUpperCase();
                        if (!groupedEntries[firstLetter]) {
                            groupedEntries[firstLetter] = [];
                        }
                        groupedEntries[firstLetter].push([key, value]);
                    }

                    // Create accordion for each group entry
                    for (const [letter, entries] of Object.entries(groupedEntries)) {
                        let letterHtml = `<h3>${letter}</h3><div>`;
                        for (const [key, value] of entries) {
                            let entryHtml = `${value}`;
                            letterHtml += entryHtml;
                        }
                        letterHtml += '</div>';
                        contentHtml += letterHtml;
                    }
                }

                $("#history-accordion").html(contentHtml);
                $("#history-accordion").accordion("destroy").accordion({
                    header: "> h3",
                    collapsible: true,
                    active: false,
                    heightStyle: "content"
                });

                // Make the entries within each letter section an accordion as well
                $("#history-accordion > div").accordion({
                    header: "> h4",
                    collapsible: true,
                    active: false,
                    heightStyle: "content"
                });

            } catch (e) {
                console.error("Failed to parse JSON data:", e);
                console.error("Received data:", data);
                $("<h3>History</h3><div><p>Failed to load history due to invalid JSON format.</p></div>").appendTo("#history-accordion");
                $("#history-accordion").accordion("refresh");

                // Attempt to salvage partial JSON
                try {
                    let partialJson = data.substring(0, data.lastIndexOf("}") + 1);
                    let partialData = JSON.parse(partialJson);
                    console.log("Partial JSON data:", partialData);
                } catch (e) {
                    console.error("Failed to parse partial JSON:", e);
                }
            }
        },
        error: function(jqXHR, textStatus, errorThrown) {
            console.error("Failed to fetch history:", textStatus, errorThrown);
            $("<h3>History</h3><div><p>Failed to load history</p></div>").appendTo("#history-accordion");
            $("#history-accordion").accordion("refresh");
        }
    });
});


            $("#apply-settings").click(function() {
                let settings = {
                    defaultLLM: $("#default-llm").val(),
                    premiumLLM: $("#premium-llm").val(),
                    temperature: $("#temperature").val()
                };
                socket.send(JSON.stringify({ type: "settings", data: settings }));
            });

        function saveSelection() {
        if (window.getSelection) {
            savedSelection = window.getSelection().getRangeAt(0);
        } else if (document.selection && document.selection.createRange) {
            savedSelection = document.selection.createRange();
        }
    }

    function restoreSelection() {
        if (savedSelection) {
            if (window.getSelection) {
                let sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedSelection);
            } else if (document.selection && savedSelection.select) {
                savedSelection.select();
            }
        }
    }

    function applyAnnotation(annotationAction, annotationText, selectedText) {
        let annotatedText = `\\${annotationAction}{${selectedText}}{${annotationText}}`;
        let boldAnnotatedText = `<strong>${annotatedText}</strong>`;

        restoreSelection();
        let selection = window.getSelection();
        if (!selection.rangeCount) return;

        let range = selection.getRangeAt(0);
        range.deleteContents();

        let newElement = document.createElement('span');
        newElement.innerHTML = boldAnnotatedText;
        range.insertNode(newElement);

        // Mise à jour de la sélection pour inclure le nouveau texte annoté
        range.setStartBefore(newElement);
        range.setEndAfter(newElement);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    $(document).on("mouseup", ".message", function(e) {
        let selection = window.getSelection().toString();
        if (selection) {
            saveSelection();
            $(".annotation-menu")
                .css({top: e.pageY, left: e.pageX})
                .show();
        }
    });

    // Hide the annotation menu when clicking outside of it
    $(document).click(function(e) {
        if (!$(e.target).closest(".annotation-menu").length){
            // If there is no text selected, hide the annotation menu
            if (!window.getSelection().toString()) {
                $(".annotation-menu").hide();
                savedSelection = null;
            }
        }
    });

    $("#apply-annotation").click(function() {
        let annotationAction = $("#annotation-action").val();
        let annotationText = $("#annotation-input").val();

        if (savedSelection && annotationText) {
            restoreSelection();
            let selectedText = window.getSelection().toString();
            applyAnnotation(annotationAction, annotationText, selectedText);
        }
        $(".annotation-menu").hide();
        savedSelection = null;
    });

    $(".annotation-menu .close-btn").click(function() {
        $(".annotation-menu").hide();
        savedSelection = null;
    });


            $(document).on("click", ".menu-option", function() {
                let option = $(this).data("option");
                let input = $("#user-input").val();
                socket.send(JSON.stringify({ message: `${option}` }));
                // Hide the menu options after selecting one
                $("#menu-options").empty();
            });

            $(document).on("click", ".regenerate", function() {
                let columnId = $(this).closest(".column").data("column-id");
                socket.send(JSON.stringify({ type: "regenerate", columnId: columnId }));
            });

            $(document).on("click", ".delete", function() {
                $(this).closest(".column").remove();
            });

            $(document).on("click", ".open-vscode", function() {
                let columnId = $(this).closest(".column").data("column-id");
                socket.send(JSON.stringify({ type: "open-vscode", columnId: columnId }));
            });

            $(".filter-bar select, .filter-bar-bottom select, #search-filter, #search-filter-bottom").on("change keyup", function() {
                let messageType = $("#filter-message-type").val();
                let agentType = $("#filter-agent-type").val();
                let searchText = $("#search-filter").val().toLowerCase();

                let messageTypeBottom = $("#filter-message-type-bottom").val();
                let agentTypeBottom = $("#filter-agent-type-bottom").val();
                let searchTextBottom = $("#search-filter-bottom").val().toLowerCase();

                $("#message-accordion > div").each(function() {
                    let $agentSection = $(this);
                    let $agentHeader = $agentSection.children("h3");
                    let $messages = $agentSection.find(".message");
                    let $headers = $agentSection.find("h4");

                    let agentVisible = false;
                    let agentName = $agentHeader.text().toLowerCase();

                    if ((agentType === "all" || agentName.includes(agentType.toLowerCase())) &&
                        (agentTypeBottom === "all" || agentName.includes(agentTypeBottom.toLowerCase()))) {
                        $messages.each(function(index) {
                            let $message = $(this);
                            let $header = $headers.eq(index);
                            let headerText = $header.text().toLowerCase();
                            let messageText = $message.text().toLowerCase();

                            let showMessage = (messageType === "all" || headerText.includes(messageType.toLowerCase())) &&
                                              (messageTypeBottom === "all" || headerText.includes(messageTypeBottom.toLowerCase())) &&
                                              (messageText.includes(searchText) || headerText.includes(searchText)) &&
                                              (messageText.includes(searchTextBottom) || headerText.includes(searchTextBottom));

                            $message.toggle(showMessage);
                            $header.toggle(showMessage);

                            if (showMessage) {
                                agentVisible = true;
                            }
                        });
                    }

                    $agentSection.toggle(agentVisible);
                });

                $("#message-accordion").accordion("refresh");
            });

            // Toggle history sidebar
            $("#toggle-history, #toggle-history-main").click(function() {
                $("#history-sidebar").toggle();
                $("#toggle-history-main").text($("#history-sidebar").is(":visible") ? "Hide History" : "Show History");
                $("#toggle-history").text($("#history-sidebar").is(":visible") ? "Hide History" : "Show History");
            });

            // Toggle settings sidebar
            $("#toggle-settings, #toggle-settings-main").click(function() {
                $("#settings-sidebar").toggle();
                $("#toggle-settings-main").text($("#settings-sidebar").is(":visible") ? "Hide Settings" : "Show Settings");
                $("#toggle-settings").text($("#settings-sidebar").is(":visible") ? "Hide Settings" : "Show Settings");
            });
        });
    </script>
</body>
</html>
