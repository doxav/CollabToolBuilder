<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Communication Interface</title>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/default.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
    display: flex;
    font-family: Arial, sans-serif;
    background-color: #f6f6f6; /* Light Blue */
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
}

#main-container {
    display: flex;
    width: 100%;
    height: 100%;
}

#history-sidebar, #settings-sidebar {
    width: 275px;
    padding: 20px;
    border-color: #f6f6f6; /* Light Blue */
    display: none;
    overflow-y: auto;
    box-sizing: border-box;
}

#history-sidebar {
    border-right: 1px solid #f6f6f6;
}

#settings-sidebar {
    border-left: 1px solid #f6f6f6;
}

#main-content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    box-sizing: border-box;
    background-color: #FFFFFF; /* White */
}

.accordion {
    margin-bottom: 20px;
    background-color: #67a1d5; /* Primary Blue */
    color: white;
}

.menu-option {
    display: inline-block;
    margin: 5px;
    padding: 5px 10px;
    border: 1px solid #1976D2; /* Darker Blue */
    border-radius: 15px;
    cursor: pointer;
    color: white;
    background-color: #67a1d5; /* Primary Blue */
    z-index: 99999;
}

.sidebar-toggle, .default_button {
    cursor: pointer;
    padding: 5px 10px;
    background-color: #67a1d5; /* Primary Blue */
    border: 1px solid #1976D2; /* Darker Blue */
    margin-bottom: 10px;
    color: white;
}

.expand-button {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    padding: 10px;
    background-color: #BBDEFB; /* Lighter Blue */
    border: 1px solid #90CAF9; /* Light Blue */
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.solution-column {
    /*flex: 1 1 calc(100% / 1 - 20px);  Par défaut, 4 colonnes */
    box-sizing: border-box;
    border: 1px solid #90CAF9; /* Light Blue */
    padding: 10px;
    margin-bottom: 10px;
    position: relative;
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background-color: #E3F2FD; /* Light Blue */
}

.pagination button {
    margin: 0 5px;
    padding: 5px 10px;
    background-color: #67a1d5; /* Darker Blue */
    color: white;
    border: none;
    cursor: pointer;
}

.annotation-menu {
    display: none;
    position: absolute;
    background: #67a1d5; /* Primary Blue */
    border: 1px solid #1976D2; /* Darker Blue */
    padding: 10px;
    z-index: 999999;
    color: white;
}

pre {
    background-color: #F5F5F5; /* Light Grey */
    padding: 10px;
    border-radius: 5px;
    overflow-x: auto;
    max-width: 100%;
    white-space: pre-wrap;
    word-wrap: break-word;
    display: block;
}

.button {
    background-color: #67a1d5; /* Primary Blue */
    color: white;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 5px;
}

.solution-columns {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    width: 100%;
}


.expand-button i {
    transition: transform 0.3s ease;
}

.solution-column.expanded .expand-button i {
    transform: rotate(180deg);
}

.solution-column.expanded {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    height: 90%;
    max-width: 1200px;
    max-height: 800px;
    z-index: 90;
    background-color: white;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 15px;
    backface-visibility: hidden;
    will-change: transform;
}

.solution-column.expanded .solution-content {
    height: 100%;
    overflow-y: auto;
    backface-visibility: hidden;
    will-change: transform;
}

/* Add an overlay when expanded */
.overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    z-index: 90;
    backface-visibility: hidden;
    will-change: transform;
}

.solution-column.expanded + .overlay {
    display: block;
    backface-visibility: hidden;
    will-change: transform;
}


.pagination button {
    margin: 0 5px;
    padding: 5px 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
}

.filter-bar { margin-bottom: 20px; }
.column { display: inline-block; vertical-align: top; margin-right: 20px; width: 30%; }
#user-input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
#send-button { margin-top: 10px; }
.close-btn { position: absolute; top: -4px; right: -4px; cursor: pointer; background-color: transparent; border: none; color: white; font-size: 16px; }
.message {
    max-width: 100%;
    word-wrap: break-word;
    white-space: pre-wrap;
}


code {
    font-family: 'Courier New', Courier, monospace;
    white-space: pre-wrap; /* Preserve line breaks and wrap text */
    word-wrap: break-word;
    overflow-x: auto;
    display: block;
}
.column-container { display: flex; flex-wrap: wrap;}
.auto-open-checkbox {
margin-top: 10px;
color: white;
}
.collapsible-message .collapsible-header {
    cursor: pointer;
    user-select: none;
}
.collapsible-message .collapsible-content {
    display: none;
}
.collapsible-message .arrow {
    display: inline-block;
    transform: rotate(0deg);
    transition: transform 0.2s;
}
.collapsible-message.open .arrow {
    transform: rotate(180deg);
}
.collapsible-message.open .collapsible-content {
    display: block;
}
</style>
</head>
<body>
<div id="main-container">
    <div id="history-sidebar">
        <div class="sidebar-toggle" id="toggle-history">Hide History</div>
        <div id="history-accordion" class="accordion">
            <h3>History</h3>
            <div id="history-content">
            </div>
        </div>
        <div id="stats-accordion" class="accordion">
            <h3>Statistiques</h3>
            <div id="stats-content">
                <label style="font-size: x-small">Number of created functions : </label><label id="number-functions">0</label><br><br>
                <label style="font-size: x-small">Number of validated functions : </label><label id="number-validated-functions">0</label><br><br>
                <label style="font-size: x-small">Number of generated solutions : </label><label id="number-solutions">0</label><br><br>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="sidebar-toggle" id="toggle-history-main">Show History</div>
        <div class="sidebar-toggle" id="toggle-settings-main">Show Settings</div>
      <div class="auto-open-checkbox">
            <input type="checkbox" id="auto-open-accordion" checked>
            <label style="color:black;" for="auto-open-accordion">Auto-focus new messages</label>
        </div>
        <div>
             <label><input type="checkbox" id="show-concepts" checked> Show Concepts</label>
        </div>
        <div class="filter-bar">
            <select id="filter-message-type">
                <option value="all">All Message Types</option>
            </select>
            <select id="filter-agent-type">
                <option value="all">All Agent Types</option>
            </select>
            <input type="text" id="search-filter" placeholder="Search...">
        </div>
        <div style="font-size: medium; font-weight: bold;">
            <label>Remaining time:</label>
            <span id="remaining-time">0</span>
        </div>

        <div id="message-accordion" class="accordion"></div>

        <div id="menu-options"></div>

        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>

        <div class="filter-bar-bottom">
            <select id="filter-message-type-bottom">
                <option value="all">All Message Types</option>
            </select>
            <select id="filter-agent-type-bottom">
                <option value="all">All Agent Types</option>
            </select>
            <input type="text" id="search-filter-bottom" placeholder="Search...">
        </div>
    </div>

    <div id="settings-sidebar">
        <div class="sidebar-toggle" id="toggle-settings">Hide Settings</div>
        <h3>Settings</h3>
        <center>
            <label for="default-llm">Default LLM:</label><br><br>
            <select id="default-llm">
                <option value="default_llm">default_llm</option>
                <option value="premium_llm">premium_llm</option>
                <option value="3_majority_chain">3_majority_chain</option>
                <option value="10_majority_chain">10_majority_chain</option>
            </select><br><br><br>

            <label for="premium-llm">Premium LLM:</label><br><br>
            <select id="premium-llm">
                <option value="default_llm">default_llm</option>
                <option value="premium_llm">premium_llm</option>
                <option value="3_majority_chain">3_majority_chain</option>
                <option value="10_majority_chain">10_majority_chain</option>
            </select><br><br><br>

            <label for="temperature">Temperature:</label><br><br>
            <input type="range" id="temperature" min="0" max="1" step="0.01" value="0.7"><br>
            <span id="value-temp">0.7</span><br><br><br>

            <button id="apply-settings" class="default_button">Apply Settings</button>
        </center>
    </div>
</div>

<div class="annotation-menu">
    <button class="close-btn">&times;</button>
    <select id="annotation-scope">
        <option value="span">Selected Text</option>
        <option value="lines">Selected Lines</option>
        <option value="full">Full Last Answer</option>
    </select>
    <select id="annotation-action">
        <option value="approve">Approve : Highlight good things</option>
        <option value="fix">Fix : Indicate what to correct or improve</option>
        <option value="delete">Delete : Explain why</option>
        <option value="variants">Variants : Ask to generate some good equivalents</option>
    </select>
    <input type="text" id="annotation-input" placeholder="Enter your annotation">
    <button id="apply-annotation">Apply</button>
</div>

<script>
$(function() {
    let socket = new WebSocket('ws://localhost:6789');
    let currentAgent = '';
    let savedSelection = null;
    let number_created_functions = 0;
    let number_validated_functions = 0;

    // Mapping of agent names to their evaluation types
    const agentEvaluations = {
        'CodingAgent': 'score',
        'TaskIdentificationAgent': 'compliance',
        // Add more agents and their evaluation types here
    };

    socket.onopen = function() {
        console.log('WebSocket connection established');
    };

    socket.onmessage = function(event) {
        console.log('Received message1');
        try {
            let data = JSON.parse(event.data);
            displayMessage(data);
        } catch (e) {
            console.log('Error parsing JSON:', e);
        }
    };

    socket.onclose = function() {
        console.log('WebSocket connection closed');
        // Try to reconnect 3 times
        setTimeout(function() {
            socket = new WebSocket('ws://localhost:6789');
        }, 500);
        setTimeout(function() {
            socket = new WebSocket('ws://localhost:6789');
        }, 1000);
        setTimeout(function() {
            socket = new WebSocket('ws://localhost:6789');
        }, 4000);
    };

    /*function sendFunctionCall(agentName, functionName, params) {
        let message = {
            agent_name: agentName,
            function: functionName,
            params: params
        };
        socket.send(JSON.stringify(message));
    }*/

    function sendFunctionCall(agentName, functionName, params, callback = null) {
        let message = {
            agent_name: agentName,
            function: functionName,
            params: params
        };
        socket.send(JSON.stringify(message));

        if (callback) {
            console.log('Setting up callback for', functionName);
            socket.onmessage = function(event) {
                console.log('Reception event');
                console.log('Received message:', event.data);
                try {
                    data = JSON.parse(event.data);
                } catch (e) {console.log('Error parsing JSON:', e); return;}
                console.log('Parsed data:', data);
                if (data.function === functionName) {
                    console.log('Calling callback with data:', data);
                    console.log('Data.message:', data.result);
                    // Add a text at the begginning of the message
                    callback(data.result);  // Call the callback with the response
                    console.log('Callback called');
                } else {
                    console.log('Function name does not match for callback, displaying message instead');
                    displayMessage(data);
                }
            };
        }
    }

    function addHistoryEntry(actionDescription) {
        let timestamp = new Date().toLocaleTimeString();
        let $entry = $(`<div style="font-size: small"><strong>[${timestamp}] ${currentAgent}</strong><br>${actionDescription}</div>`);
        $('#history-content').append($entry);
    }

    function displayMessage(data) {
        currentAgent = data.agent_name;
        let title = `${data.agent_name} | ${data.message_type} | ${new Date().toLocaleTimeString()}`;
        if (data.message_type === null) {
            title = `${data.agent_name} | ${new Date().toLocaleTimeString()}`;
        }
        // Initialize content variable
        let content = '';

        // Check if message_type includes "Inference streaming output"
        if (data.message_type && data.message_type.includes("Inference streaming output")) {
            // Do not wrap the message in collapsible container
            content = `${formatMessage(data.message)}`;
        } else {
            // First, check if message is code or prompt
            let isCode = isPythonCode(data.message);
            let isPrompt = isPromptMessage(data.message);

            if (isCode || isPrompt) {
                // Wrap the message in a collapsible div with an arrow
                content = `
                    <div class="collapsible-message open">
                        <div class="collapsible-header">
                            <span class="arrow"><i class="fa-solid fa-chevron-down"></i></span> <span>${isCode ? 'Code' : 'Prompt'}</span>
                        </div>
                        <div class="collapsible-content">
                            ${formatMessage(data.message)}
                        </div>
                    </div>
                `;
            } else {
                content = `${formatMessage(data.message)}`;
            }
        }

        // If the message_type is null, set it to " "
        if (data.message_type === null) {
            data.message_type = " ";
        }

        if (data.message_type === "time_end") {
            // Convert remaining time to minutes and seconds
            let remainingTime = parseInt(data.message);
            let minutes = Math.floor(remainingTime / 60);
            let seconds = remainingTime % 60;
            document.getElementById("remaining-time").textContent = `${minutes}m ${seconds}s`;
            // Countdown the remaining time
            let countdown = setInterval(function() {
                remainingTime--;
                minutes = Math.floor(remainingTime / 60);
                seconds = remainingTime % 60;
                document.getElementById("remaining-time").textContent = `${minutes}m ${seconds}s`;
                if (remainingTime <= 0) {
                    clearInterval(countdown);
                }
            }, 1000);
            return;
        }

        let $agentAccordion = $(`#message-accordion > div[data-agent="${data.agent_name}"]`);

        // Generalize handling of multiple solutions
        if (data.column_max !== undefined && data.column_id !== undefined && data.message_type === "NEW inference result recieved") {
            number_created_functions++;
            document.getElementById("number-functions").textContent = number_created_functions;
            console.log("Handling multiple solutions");
            handleMultipleSolutions(data);
            // If it's the last solution and there are more than 4 solutions, add pagination
            if (data.column_id === data.column_max - 1 && data.column_max > 4) {
                // Add the html code for the pagination
                let pagination = document.createElement('div');
                pagination.className = 'pagination';
                pagination.id = 'pagination';
                pagination.innerHTML = `<button id="prev-page">Previous</button><span id="page-info">Page 1 of 1</span><button id="next-page">Next</button>`;

                // Add the pagination to the solution columns
                let solutionColumns = document.querySelector('.solution-columns');
                solutionColumns.parentNode.insertBefore(pagination, solutionColumns.nextSibling);

                // Add event listeners for the pagination buttons taking into account that there are 4 columns per page
                let columnMax = data.column_max;
                let currentPage = 1;
                let totalPages = Math.ceil(columnMax / 4);
                let $columns = $('.solution-column');
                let $pageInfo = $('#page-info');

                $('#next-page').click(function () {
                    if (currentPage < totalPages) {
                        currentPage++;
                        $columns.hide();
                        $columns.slice((currentPage - 1) * 4, currentPage * 4).show();
                        $pageInfo.text(`Page ${currentPage} of ${totalPages}`);
                    }
                });

                $('#prev-page').click(function () {
                    if (currentPage > 1) {
                        currentPage--;
                        $columns.hide();
                        $columns.slice((currentPage - 1) * 4, currentPage * 4).show();
                        $pageInfo.text(`Page ${currentPage} of ${totalPages}`);
                    }
                });

                $columns.hide();
                $columns.slice(0, 4).show();
                $pageInfo.text(`Page ${currentPage} of ${totalPages}`);

                // Update the pagination info with the total number of pages
                totalPages = Math.ceil(columnMax / 4);
                $pageInfo.text(`Page ${currentPage} of ${totalPages}`);
            }

        } else if (data.message_type === "Scores") {
            handleEvaluationResults(data);
             let $scoreButtons = $agentAccordion.find("button[id^='score-']");
        // Stock scores in an array retrieved with the regex "const regex = new RegExp(`^${i}\\.\\s+(SUCCESS|FAILED)`, 'm');"

        // for each button, we retrieve the score and we change the text of the button
        $scoreButtons.each(function (index, button) {
            const regex = new RegExp(`^${index}\\.\\s+\\u001b\\[\\d+m(SUCCESS|FAILED)\\u001b\\[0m`, 'm');
            const match = data.message.match(regex);
            if (match) {
                console.log("Match found:", match);
                const score = match[1];
                button.textContent = score;
                if (score === "SUCCESS") {
                    button.style.backgroundColor = "green";
                } else {
                    button.style.backgroundColor = "red";
                }
                // Extract the full text following the solution number
                const fullTextRegex = new RegExp(`^${index}\\.\\s+\\u001b\\[\\d+m${score}\\u001b\\[0m\\s+/\\s+SCORE:([^/]+)/`, 'm');
                const fullTextMatch = data.message.match(fullTextRegex);

                if (fullTextMatch) {
                    const fullText = fullTextMatch[1].trim();

                    // Attach a click event to display the full text in a pop-up
                    button.addEventListener('click', function () {
                        alert(`Score of solution ${index + 1}:\n\n${fullText}`);
                    });
                }
            } else {
                button.textContent = "Scoring failed";
                button.style.backgroundColor = "red";
            }
        });

        } else if (data.message === "Skip for how many rounds? ") {
            // Existing code for handling this case
            // COPIED CODE
            let $question = $(`<p>Skip for how many rounds ?</p>`);
            // Afficher une liste déroulante de 1 à 10 avec la possibilité de saisir un autre nombre
            let $select = $(`<select id="rounds-select"></select>`);
            for (let i = 1; i <= 10; i++) {
                $select.append(`<option value="${i}">${i}</option>`);
            }
            $select.append(`<option value="other">Other</option>`);
            // Si "Other" est sélectionné, afficher un champ de saisie pour entrer le nombre de tours
            $select.change(function () {
                if ($(this).val() === "other") {
                    $(this).replaceWith(`<input type="number" id="rounds-input" min="1" max="100" step="1" value="1">`);
                }
            });
            let $button = $(`<button id="send-rounds">Send</button>`);
            let $container = $(`<div></div>`);
            $container.append($question);
            $container.append($select);
            $container.append($button);
            // Ajouter le conteneur sous l'accordéon
            $("#message-accordion").append($container);
            // Gérer l'événement du bouton pour envoyer le nombre de tours au serveur
            $button.click(function () {
                let rounds;
                if ($("#rounds-select").length) {
                    rounds = $("#rounds-select").val();
                } else {
                    rounds = $("#rounds-input").val();
                }

                if (rounds === "other") {
                    rounds = $("#rounds-input").val();
                }

                rounds = parseInt(rounds);
                if (isNaN(rounds) || rounds < 1) {
                    rounds = 1;
                } else if (rounds > 100) {
                    rounds = 100;
                }
                socket.send(JSON.stringify({message: rounds}));

                $container.remove();
                let actionDescription = `User set skip rounds to ${rounds}`;
                addHistoryEntry(actionDescription);
            });
            // END COPY

          } else if (data.message_type === "NUM_PARALLEL_INFERENCES") {
              // Existing code for handling this case
              // COPIED CODE
              let $question = $(`<p>How many parallel inferences?</p>`);
              let $select = $(`<select id="parallel-inferences-select"></select>`);
              for (let i = 1; i <= 4; i++) {
                  $select.append(`<option value="${i}">${i}</option>`);
              }
              let $button = $(`<button id="send-parallel-inferences">Send</button>`);
              let $container = $(`<div></div>`);
              $container.append($question);
              $container.append($select);
              $container.append($button);
              $("#message-accordion").append($container);
              $button.click(function () {
                  let parallelInferences = $("#parallel-inferences-select").val();
                  socket.send(JSON.stringify({message: parallelInferences}));
                  $container.remove();
              });
              // END COPY


          } else if (data.message_type == "INFERENCE CHOICE") {
              // Existing code for handling this case
              // COPIED CODE
              let $question = $(`<p>Proceed to inference? You can also proceed using a premium LLM.</p>`);
              let $yesButton = $(`<button id="yes-button">Yes</button>`);
              let $noButton = $(`<button id="no-button">No</button>`);
              let $premiumButton = $(`<button id="premium-button">Use premium LLM</button>`);
              let $container = $(`<div></div>`);
              $container.append($question);
              $container.append($yesButton);
              $container.append($noButton);
              $container.append($premiumButton);
              $("#message-accordion").append($container);
              $yesButton.click(function () {
                  socket.send(JSON.stringify({message: "y"}));
                  $container.remove();
              });
              $noButton.click(function () {
                  socket.send(JSON.stringify({message: "n"}));
                  $container.remove();
              });
              $premiumButton.click(function () {
                  socket.send(JSON.stringify({message: "p"}));
                  $container.remove();
              });
            // END COPY

        } else if (data.message_type === "NUM_PARALLEL_INFERENCES SYNTHESIS MODE CHOICE"){
            // Existing code for handling this case
            // COPIED CODE
            let $question = $(`<p>Proceed with synthesis mode?</p>`);
            let $yesButton = $(`<button id="yes-button">Yes</button>`);
            let $noButton = $(`<button id="no-button">No</button>`);
            let $container = $(`<div></div>`);
            $container.append($question);
            $container.append($yesButton);
            $container.append($noButton);
            $("#message-accordion").append($container);
            $yesButton.click(function () {
                socket.send(JSON.stringify({message: "1"}));
                $container.remove();
            });
            $noButton.click(function () {
                socket.send(JSON.stringify({message: "0"}));
                $container.remove();
            });
            // END COPY

        } else if (data.message_type === "fix_error"){
            let $question = $(`<p>Do you want to edit the code to fix the error (you will also be requested first) ?</p>`);

   function formatMessage(message) {
    // Remove ANSI color codes
    let cleanString = message.replace(/\u001b\[\d+m/g, '');
    // Remove all ANSI escape sequences
    cleanString = cleanString.replace(/\u\d+b/g, '');

    // Regular expression to match code blocks
    const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;

    // Extract code blocks and replace with placeholders
    let codeBlocks = [];
    cleanString = cleanString.replace(codeBlockRegex, function(match, lang, code) {
        codeBlocks.push({ lang: lang, code: code });
        return `[[CODE_BLOCK_${codeBlocks.length - 1}]]`;
    });

    // Escape HTML characters in the rest of the text
    cleanString = escapeHtml(cleanString);

    // Replace remaining line breaks in the rest of the text with <br>
    cleanString = cleanString.replace(/\n/g, '<br>');

    // Replace placeholders with highlighted code
    codeBlocks.forEach(function(block, index) {
        let highlightedCode;
        if (block.lang && hljs.getLanguage(block.lang)) {
            highlightedCode = hljs.highlight(block.lang, block.code).value;
        } else {
            highlightedCode = hljs.highlightAuto(block.code).value;
        }
        // Preserve line breaks and indentation in code blocks
        cleanString = cleanString.replace(
            `[[CODE_BLOCK_${index}]]`,
            `<pre><code>${highlightedCode}</code></pre>`
        );
    });

    return `${cleanString}`;
}


function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
        '`': '&#096;',
        '/': '&#x2F;',
    };
    return text.replace(/[&<>"'`/]/g, function (m) {
        return map[m];
    });
}

function isPythonCode(message) {
    // Check if message contains code blocks with python code
    return /```python[\s\S]*?```/i.test(message);
}

function isPromptMessage(message) {
    // Check if the message looks like a prompt
    return /^Reasoning\b|^You are\b|^As an AI language model\b|^Please\b|^Write\b|^Generate\b|^Explain\b/i.test(message);
}

        } else if (document.selection && document.selection.createRange) {

        }
    }

    function restoreSelection() {
        if (savedSelection) {
            if (window.getSelection) {
                let sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedSelection);
            } else if (document.selection && savedSelection.select) {
                savedSelection.select();
            }
        }

    function applyAnnotation(annotationAction, annotationText, selectedText) {
        let annotatedText = `\\${annotationAction}{${selectedText}}{${annotationText}}`;
        let boldAnnotatedText = `<strong>${annotatedText}</strong>`;

        restoreSelection();
        let selection = window.getSelection();
        if (!selection.rangeCount) return;

        let range = selection.getRangeAt(0);
        range.deleteContents();

        let newElement = document.createElement('span');
        newElement.innerHTML = boldAnnotatedText;
        range.insertNode(newElement);

        // Update selection to include new annotated text
        range.setStartBefore(newElement);
        range.setEndAfter(newElement);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    $(document).on("mouseup", ".message", function(e) {
        let selection = window.getSelection().toString();
        if (selection) {
            // Highlight selected text
            let range = window.getSelection().getRangeAt(0);
            let span = document.createElement("span");
            span.style.backgroundColor = "yellow";
            span.style.color = "black";
            span.id = "temphighlight";
            range.surroundContents(span);
            saveSelection();
            $(".annotation-menu")
                .css({top: e.pageY, left: e.pageX})
                .show();
        }
    });

    // Hide the annotation menu when clicking outside of it
    $(document).click(function(e) {
        if (!$(e.target).closest(".annotation-menu").length){
            if (!window.getSelection().toString()) {
                $(".annotation-menu").hide();
                savedSelection = null;
                // Remove all tempHighlight spans
                let tempHighlights = document.querySelectorAll("#temphighlight");
                for (let i = 0; i < tempHighlights.length; i++) {
                    let parent = tempHighlights[i].parentNode;
                    while (tempHighlights[i].firstChild) {
                        parent.insertBefore(tempHighlights[i].firstChild, tempHighlights[i]);
                    }
                    parent.removeChild(tempHighlights[i]);
                }
            }
        }
        // Collapse the column if clicking outside of it unless if it's on the annotation menu
        if (!$(e.target).closest(".solution-column").length && !$(e.target).closest(".annotation-menu").length) {
            $(".solution-column").removeClass("expanded");
            $(".expand-button i").removeClass("fa-compress").addClass("fa-expand");
        }
    });

    $("#apply-annotation").click(function() {
        let annotationAction = $("#annotation-action").val();
        let annotationText = $("#annotation-input").val();

        if (savedSelection && annotationText) {
            restoreSelection();
            let selectedText = window.getSelection().toString();
            applyAnnotation(annotationAction, annotationText, selectedText);
        }
        $(".annotation-menu").hide();
        savedSelection = null;
        // Remove all tempHighlight spans
        let tempHighlights = document.querySelectorAll("#temphighlight");
        for (let i = 0; i < tempHighlights.length; i++) {
            let parent = tempHighlights[i].parentNode;
            while (tempHighlights[i].firstChild) {
                parent.insertBefore(tempHighlights[i].firstChild, tempHighlights[i]);
            }
            parent.removeChild(tempHighlights[i]);
        }
        let actionDescription = `User applied annotation: action="${annotationAction}", text="${annotationText}"`;
        addHistoryEntry(actionDescription);
    });

    $(".annotation-menu .close-btn").click(function() {
        $(".annotation-menu").hide();
        savedSelection = null;
        // Remove all tempHighlight spans
        let tempHighlights = document.querySelectorAll("#temphighlight");
        for (let i = 0; i < tempHighlights.length; i++) {
            let parent = tempHighlights[i].parentNode;
            while (tempHighlights[i].firstChild) {
                parent.insertBefore(tempHighlights[i].firstChild, tempHighlights[i]);
            }
            parent.removeChild(tempHighlights[i]);
        }
    });

    $(document).on("click", ".menu-option", function() {
        let option = $(this).data("option");
        let input = $("#user-input").val();
        socket.send(JSON.stringify({ message: `${option}` }));
        // Hide the menu options after selecting one
        $("#menu-options").empty();
        // Retrieve the text of the selected option
        let text = $(this).text();
        let actionDescription = `User selected menu option "${text}"`;
        addHistoryEntry(actionDescription);
    });

    $(document).on("click", ".regenerate", function() {
        let columnId = $(this).closest(".column").data("column-id");
        socket.send(JSON.stringify({ type: "regenerate", columnId: columnId }));
    });

    $(document).on("click", ".delete", function() {
        $(this).closest(".column").remove();
    });

    $(document).on("click", ".open-vscode", function() {
        let columnId = $(this).closest(".column").data("column-id");
        socket.send(JSON.stringify({ type: "open-vscode", columnId: columnId }));
    });

    $(".filter-bar select, .filter-bar-bottom select, #search-filter, #search-filter-bottom").on("change keyup", function() {
        let messageType = $("#filter-message-type").val();
        let agentType = $("#filter-agent-type").val();
        let searchText = $("#search-filter").val().toLowerCase();

        let messageTypeBottom = $("#filter-message-type-bottom").val();
        let agentTypeBottom = $("#filter-agent-type-bottom").val();
        let searchTextBottom = $("#search-filter-bottom").val().toLowerCase();

        $("#message-accordion > div").each(function() {
            let $agentSection = $(this);
            let $agentHeader = $agentSection.children("h3");
            let $messages = $agentSection.find(".message");
            let $headers = $agentSection.find("h4");

            let agentVisible = false;
            let agentName = $agentHeader.text().toLowerCase();

            if ((agentType === "all" || agentName.includes(agentType.toLowerCase())) &&
                (agentTypeBottom === "all" || agentName.includes(agentTypeBottom.toLowerCase()))) {
                $messages.each(function(index) {
                    let $message = $(this);
                    let $header = $headers.eq(index);
                    let headerText = $header.text().toLowerCase();
                    let messageText = $message.text().toLowerCase();

                    let showMessage = (messageType === "all" || headerText.includes(messageType.toLowerCase())) &&
                                      (messageTypeBottom === "all" || headerText.includes(messageTypeBottom.toLowerCase())) &&
                                      (messageText.includes(searchText) || headerText.includes(searchText)) &&
                                      (messageText.includes(searchTextBottom) || headerText.includes(searchTextBottom));

                    $message.toggle(showMessage);
                    $header.toggle(showMessage);

                    if (showMessage) {
                        agentVisible = true;
                    }
                });
            }

            $agentSection.toggle(agentVisible);
        });

        $("#message-accordion").accordion("refresh");
    });

    // Toggle history sidebar
    $("#toggle-history, #toggle-history-main").click(function() {
        $("#history-sidebar").toggle();
        $("#toggle-history-main").text($("#history-sidebar").is(":visible") ? "Hide History" : "Show History");
        $("#toggle-history").text($("#history-sidebar").is(":visible") ? "Hide History" : "Show History");
    });

    // Toggle settings sidebar
    $("#toggle-settings, #toggle-settings-main").click(function() {
        $("#settings-sidebar").toggle();
        $("#toggle-settings-main").text($("#settings-sidebar").is(":visible") ? "Hide Settings" : "Show Settings");
        $("#toggle-settings").text($("#settings-sidebar").is(":visible") ? "Hide Settings" : "Show Settings");
    });

    // Synchronize message type filter between the two filter bars
    $("#filter-message-type").change(function() {
        $("#filter-message-type-bottom").val($(this).val());
    });

    $("#filter-message-type-bottom").change(function() {
        $("#filter-message-type").val($(this).val());
    });

    // Synchronize agent type filter between the two filter bars
    $("#filter-agent-type").change(function() {
        $("#filter-agent-type-bottom").val($(this).val());
    });

    $("#filter-agent-type-bottom").change(function() {
        $("#filter-agent-type").val($(this).val());
    });

    // When refresh the page, clear the columnsToDelete
    localStorage.removeItem('columnsToDelete');

});

// If the websocket connection is closed, due to an invalid header frame, try to reconnect
socket.onclose = function(event) {
    console.log("Websocket connection closed:", event);
    if (event.code === 1002) {
        console.log("Invalid header frame, trying to reconnect...");
        setTimeout(function() {
            socket = new WebSocket(`ws://${window.location.host}/ws`);
            socket.onmessage = function(event) {
                let data = JSON.parse(event.data);
                handleMessage(data);
            };
        }, 1000);
    }
};
</script>
</body>
</html>
