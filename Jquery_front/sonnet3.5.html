<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket UI</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
        }
        #left-sidebar, #main-content, #right-sidebar {
            padding: 10px;
        }
        #left-sidebar {
            width: 200px;
            background-color: #f0f0f0;
        }
        #main-content {
            flex-grow: 1;
        }
        #right-sidebar {
            width: 200px;
            background-color: #f0f0f0;
        }
        .ui-accordion .ui-accordion-content {
            padding: 10px;
        }
        .message-column {
            display: inline-block;
            vertical-align: top;
            width: 30%;
            margin-right: 1%;
        }
        .filter-bar {
            margin-bottom: 10px;
        }
        .option-bubble {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border-radius: 15px;
            cursor: pointer;
        }
        .annotate-menu {
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="left-sidebar">
        <h3>Exchange History</h3>
        <div id="history-accordion"></div>
        <a href="#" id="refresh-history">Refresh History</a>
    </div>
    <div id="main-content">
        <div class="filter-bar">
            <select id="message-type-filter">
                <option value="">All Message Types</option>
            </select>
            <select id="agent-type-filter">
                <option value="">All Agent Types</option>
            </select>
            <input type="text" id="search-filter" placeholder="Search...">
        </div>
        <div id="message-accordion"></div>
        <div id="multi-column-display"></div>
        <div id="menu-options"></div>
        <input type="text" id="user-input" placeholder="Enter your message...">
        <button id="send-message">Send</button>
        <div class="filter-bar">
            <!-- Duplicate of the top filter bar -->
        </div>
    </div>
    <div id="right-sidebar">
        <h3>Settings</h3>
        <label for="default-llm">Default LLM:</label>
        <select id="default-llm"></select>
        <label for="premium-llm">Premium LLM:</label>
        <select id="premium-llm"></select>
        <label for="temperature">Temperature:</label>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.5">
        <button id="save-settings">Save Settings</button>
    </div>
    <div class="annotate-menu">
        <select id="annotate-scope">
            <option value="span">Selected Text</option>
            <option value="lines">Selected Lines</option>
            <option value="full">Full Last Answer</option>
        </select>
        <select id="annotate-action">
            <option value="edit">Edit with VSCode</option>
            <option value="label-answer">Label for Answer Improvement</option>
            <option value="label-prompt">Label for Prompt Improvement</option>
        </select>
        <button id="annotate-apply">Apply</button>
    </div>

    <script>
        $(document).ready(function() {
            const socket = new WebSocket('ws://localhost:6789');
            let currentColumnId = null;
            let currentColumnMax = 1;

            socket.onopen = function(e) {
                console.log("Connected to WebSocket server");
            };

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            function handleMessage(data) {
                if (data.column_id) {
                    handleColumnMessage(data);
                } else {
                    appendMessage(data);
                }

                if (data.input) {
                    showInputField();
                }

                updateFilters();
            }

            function handleColumnMessage(data) {
                if (data.column_id !== currentColumnId) {
                    currentColumnId = data.column_id;
                    currentColumnMax = data.column_max || 1;
                    $('#multi-column-display').empty();
                    for (let i = 0; i < currentColumnMax; i++) {
                        $('#multi-column-display').append(`<div class="message-column" id="column-${i}"></div>`);
                    }
                }

                const columnIndex = parseInt(data.column_id) - 1;
                $(`#column-${columnIndex}`).append(`
                    <div>
                        <h4>${data.agent_name} | ${data.message_type} | ${new Date().toLocaleTimeString()}</h4>
                        <p>${data.message}</p>
                        <button class="regenerate">Regenerate</button>
                        <button class="delete">Delete</button>
                        <button class="open-vscode">Open in VSCode</button>
                    </div>
                `);
            }

            function appendMessage(data) {
                const accordionId = `accordion-${data.agent_name.replace(/\s+/g, '-')}`;
                if (!$(`#${accordionId}`).length) {
                    $('#message-accordion').append(`<div id="${accordionId}"></div>`);
                    $(`#${accordionId}`).accordion({
                        header: "> div > h3",
                        collapsible: true,
                        active: false,
                        heightStyle: "content"
                    });
                }

                const messageHtml = `
                    <div class="message" data-agent="${data.agent_name}" data-type="${data.message_type}">
                        <h3>${data.agent_name} | ${data.message_type} | ${new Date().toLocaleTimeString()}</h3>
                        <div>
                            <p>${data.message}</p>
                        </div>
                    </div>
                `;

                $(`#${accordionId}`).append(messageHtml).accordion("refresh");
            }

            function showInputField() {
                $('#user-input').show();
                $('#send-message').show();
            }

            function updateFilters() {
                const messageTypes = new Set();
                const agentTypes = new Set();

                $('.message').each(function() {
                    messageTypes.add($(this).data('type'));
                    agentTypes.add($(this).data('agent'));
                });

                $('#message-type-filter').html('<option value="">All Message Types</option>');
                messageTypes.forEach(type => {
                    $('#message-type-filter').append(`<option value="${type}">${type}</option>`);
                });

                $('#agent-type-filter').html('<option value="">All Agent Types</option>');
                agentTypes.forEach(agent => {
                    $('#agent-type-filter').append(`<option value="${agent}">${agent}</option>`);
                });
            }

            $('.filter-bar select, #search-filter').on('change keyup', function() {
                const messageType = $('#message-type-filter').val();
                const agentType = $('#agent-type-filter').val();
                const searchText = $('#search-filter').val().toLowerCase();

                $('.message').each(function() {
                    const $message = $(this);
                    const showMessage =
                        (!messageType || $message.data('type') === messageType) &&
                        (!agentType || $message.data('agent') === agentType) &&
                        (!searchText || $message.text().toLowerCase().includes(searchText));

                    $message.toggle(showMessage);
                });
            });

            $('#send-message').click(function() {
                const message = $('#user-input').val();
                if (message) {
                    socket.send(JSON.stringify({
                        message: message,
                        agent_name: 'User',
                        message_type: 'UserInput',
                        input: false
                    }));
                    $('#user-input').val('');
                }
            });

            $('#save-settings').click(function() {
                const settings = {
                    defaultLLM: $('#default-llm').val(),
                    premiumLLM: $('#premium-llm').val(),
                    temperature: $('#temperature').val()
                };
                socket.send(JSON.stringify({
                    message: JSON.stringify(settings),
                    agent_name: 'System',
                    message_type: 'SettingsUpdate',
                    input: false
                }));
            });

            $('#refresh-history').click(function(e) {
                e.preventDefault();
                $.get('/get_history', function(data) {
                    $('#history-accordion').empty();
                    data.forEach(item => {
                        $('#history-accordion').append(`
                            <h3>${item.date}</h3>
                            <div>
                                <p>${item.summary}</p>
                            </div>
                        `);
                    });
                    $('#history-accordion').accordion("refresh");
                });
            });

            $('#message-accordion').on('mouseup', function() {
                const selection = window.getSelection().toString();
                if (selection) {
                    $('.annotate-menu').css({
                        display: 'block',
                        left: event.pageX + 'px',
                        top: event.pageY + 'px'
                    });
                }
            });

            $('#annotate-apply').click(function() {
                const scope = $('#annotate-scope').val();
                const action = $('#annotate-action').val();
                const selection = window.getSelection().toString();

                let annotation = `[${scope.toUpperCase()}][${action.toUpperCase()}] ${selection}`;
                $('#user-input').val(annotation);
                $('.annotate-menu').hide();
            });

            $(document).click(function(event) {
                if (!$(event.target).closest('.annotate-menu').length) {
                    $('.annotate-menu').hide();
                }
            });

            $('#multi-column-display').on('click', '.regenerate', function() {
                // Implement regenerate logic
            });

            $('#multi-column-display').on('click', '.delete', function() {
                $(this).closest('.message-column').remove();
            });

            $('#multi-column-display').on('click', '.open-vscode', function() {
                // Implement open in VSCode logic
            });
        });
    </script>
</body>
</html>
