<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        #user-input {
            width: calc(100% - 70px);
            padding: 5px;
        }
        #send-message {
            width: 60px;
            padding: 5px;
        }
        .message {
            margin-bottom: 10px;
        }
        .user {
            text-align: right;
            color: blue;
        }
        .assistant {
            text-align: left;
            color: green;
        }
        .system {
            text-align: center;
            color: gray;
            font-style: italic;
        }
        .accordion {
            background-color: #eee;
            color: #444;
            cursor: pointer;
            padding: 18px;
            width: 100%;
            text-align: left;
            border: none;
            outline: none;
            transition: 0.4s;
        }
        .active, .accordion:hover {
            background-color: #ccc;
        }
        .panel {
            padding: 0 18px;
            background-color: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
        }
        #column-container {
            display: flex;
            justify-content: space-between;
        }
        .column {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 0 5px;
        }
        #filter-container {
            margin-bottom: 10px;
        }
        .filter-button {
            margin-right: 5px;
        }
        .menu-option {
            cursor: pointer;
            margin: 5px 0;
        }
        #menu-options {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="filter-container"></div>
    <div id="chat-container"></div>
    <div id="column-container"></div>
    <div id="menu-options"></div>
    <input type="text" id="user-input" placeholder="Type your message..." style="display: none;">
    <button id="send-message" style="display: none;">Send</button>

    <script>
        $(document).ready(function() {
            const socket = new WebSocket('ws://localhost:6789');
            const agents = new Set();
            let currentAccordion = null;

            socket.onopen = function(event) {
                console.log('WebSocket connection opened');
            };

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            socket.onclose = function(event) {
                console.log('WebSocket connection closed');
            };

            function handleMessage(data) {
                if (data.column_id) {
                    handleColumnMessage(data);
                } else {
                    appendMessage(data);
                }

                if (data.input) {
                    showInputField();
                }

                if (data.message.includes("BEFORE") || data.message.includes("AFTER")) {
                    handleMenuMessage(data);
                }

                updateFilters();
            }

            function appendMessage(data) {
                const messageDiv = $('<div></div>').addClass('message').addClass(data.agent_name.toLowerCase());
                messageDiv.text(`${data.agent_name}: ${data.message}`);

                if (currentAccordion) {
                    currentAccordion.find('.panel').append(messageDiv);
                } else {
                    const accordionButton = $('<button></button>').addClass('accordion').text(data.agent_name);
                    const panel = $('<div></div>').addClass('panel');
                    panel.append(messageDiv);
                    $('#chat-container').append(accordionButton).append(panel);
                    currentAccordion = accordionButton;

                    accordionButton.click(function() {
                        this.classList.toggle("active");
                        const panel = this.nextElementSibling;
                        if (panel.style.maxHeight) {
                            panel.style.maxHeight = null;
                        } else {
                            panel.style.maxHeight = panel.scrollHeight + "px";
                        }
                    });
                }

                agents.add(data.agent_name);
            }

            function handleColumnMessage(data) {
                const columnId = data.column_id;
                const columnMax = data.column_max;

                if ($(`#column-${columnId}`).length === 0) {
                    for (let i = 1; i <= columnMax; i++) {
                        if ($(`#column-${i}`).length === 0) {
                            $('#column-container').append(`<div id="column-${i}" class="column"></div>`);
                        }
                    }
                }

                $(`#column-${columnId}`).append(`<p>${data.message}</p>`);
            }

            function showInputField() {
                $('#user-input, #send-message').show();
            }

            function updateFilters() {
                $('#filter-container').empty();
                agents.forEach(agent => {
                    const button = $('<button></button>').addClass('filter-button').text(agent);
                    button.click(function() {
                        $('.message').show();
                        if (!$(this).hasClass('active')) {
                            $('.message').not(`.${agent.toLowerCase()}`).hide();
                        }
                        $('.filter-button').removeClass('active');
                        $(this).addClass('active');
                    });
                    $('#filter-container').append(button);
                });
            }

            function handleMenuMessage(data) {
                const menuOptions = data.message.split('\n').filter(line => line.trim().startsWith('['));
                $('#menu-options').empty();
                menuOptions.forEach(option => {
                    const match = option.match(/\[([A-Z])\](.*)/);
                    if (match) {
                        const [, letter, content] = match;
                        $('#menu-options').append(`<div class="menu-option" data-letter="${letter}">${content}</div>`);
                    }
                });
            }

            $('#menu-options').on('click', '.menu-option', function() {
                const letter = $(this).data('letter');
                const inputContent = $('#user-input').val();
                if (validateMenuInput(letter, inputContent)) {
                    const message = `${letter}:${inputContent}`;
                    sendMessage(message, 'User', 'MenuSelection');
                } else {
                    alert('Input does not match the required format.');
                }
            });

            function sendMessage(message, agentName, messageType) {
                socket.send(JSON.stringify({
                    message: message,
                    agent_name: agentName,
                    message_type: messageType,
                    input: false
                }));
            }

            $('#send-message').click(function() {
                const message = $('#user-input').val();
                if (message) {
                    sendMessage(message, 'User', 'UserInput');
                    $('#user-input').val('');
                }
            });

            function validateMenuInput(letter, input) {
                const option = $(`#menu-options .menu-option[data-letter="${letter}"]`).text();
                const regexMatch = option.match(/\/(.+)\//);
                if (regexMatch) {
                    const regex = new RegExp(regexMatch[1]);
                    return regex.test(input);
                }
                return true; // If no regex is specified, always return true
            }

            $('#user-input').keypress(function(e) {
                if (e.which == 13) { // Enter key
                    $('#send-message').click();
                    return false;
                }
            });
        });
    </script>
</body>
</html>
