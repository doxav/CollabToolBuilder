name: Automated Tests for CollabFunctionGPTCreator

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NON_SECRET_VARIABLE: "some_value"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y scrot

    - name: Start Elasticsearch
      run: |
        docker run -d --name elasticsearch -p 9200:9200 \
          -e "discovery.type=single-node" \
          -e "xpack.security.enabled=true" \
          -e "ELASTIC_PASSWORD=changeme" \
          docker.elastic.co/elasticsearch/elasticsearch:8.10.1

    - name: Wait for Elasticsearch to be ready
      run: |
        for i in {1..30}; do
          if curl -k -u elastic:changeme -s https://localhost:9200 >/dev/null; then
            echo "Elasticsearch is up!"
            break
          else
            echo "Waiting for Elasticsearch to start..."
            sleep 10
          fi
        done

    - name: Generate Kibana Service Account Token
      run: |
        SERVICE_TOKEN=$(docker exec elasticsearch bin/elasticsearch-service-tokens create elastic/kibana kibana-service-token | grep "TOKEN" | awk '{print $3}')
        echo "SERVICE_TOKEN=${SERVICE_TOKEN}" >> $GITHUB_ENV

    - name: Start Kibana
      run: |
        docker run -d --name kibana -p 5601:5601 \
          -e ELASTICSEARCH_HOSTS='https://elasticsearch:9200' \
          -e ELASTICSEARCH_SERVICEACCOUNT_TOKEN="${{ env.SERVICE_TOKEN }}" \
          -e ELASTICSEARCH_SSL_VERIFICATIONMODE='none' \
          docker.elastic.co/kibana/kibana:8.10.1

    - name: Wait for Kibana to be ready
      run: |
        for i in {1..30}; do
          if curl -k -s https://localhost:5601/api/status | grep -q '"state":"available"'; then
            echo "Kibana is up!"
            break
          else
            echo "Waiting for Kibana to start..."
            sleep 10
          fi
        done

    - name: Create config.py
      run: |
        cat <<EOF > config.py
        import os
        OPENAI_API_KEY = "${{ secrets.OPENAI_API_KEY }}"
        MODELS_CONFIG_LIST = {
            "code_gpt": "gpt-4o-mini-2024-07-18",
            "smart_gpt": "gpt-4o-mini-2024-07-18",
            "basic_gpt": "gpt-4o-mini-2024-07-18"
            }
        openai_api_key = OPENAI_API_KEY
        os.environ['OPENAI_API_KEY'] = OPENAI_API_KEY
        elastic_url_port = 'https://localhost:9200'
        kibana_url_port = 'https://localhost:5601'
        elastic_service_token="${{ env.SERVICE_TOKEN }}"
        PickleCacheActivated = False
        EOF

    - name: Run Selenium script and capture logs
      run: |
        nohup python learn.py > learn_logs.txt

    - name: Execute run_multi.sh and capture logs
      run: |
        bash run_multi.sh optuna_opti_Synthesis_coder GPT4 &
        sleep 120
        kill $!

    - name: Collect and Upload logs
      run: |
        mkdir -p logs_and_screenshots
        cp logs/*.log logs_and_screenshots/ || true
        cp screenshots/*.png logs_and_screenshots/ || true

    - name: Upload logs and screenshots
      uses: actions/upload-artifact@v3
      with:
        name: logs-and-screenshots
        path: logs_and_screenshots

    - name: Logs of learn.py execution
      if: always()
      run: |
        cat learn_logs.txt

    - name: Stop Elasticsearch and Kibana
      if: always()
      run: |
        docker stop kibana
        docker stop elasticsearch
