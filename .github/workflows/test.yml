name: Automated Tests for CollabFunctionGPTCreator

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NON_SECRET_VARIABLE: "some_value"
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
        ports:
          - 9200:9200
        env:
          ELASTIC_USERNAME: ghactions
          ELASTIC_PASSWORD: changeme
          discovery.type: 'single-node'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: '--health-cmd="curl -k -f https://localhost:9200/ -u elastic:changeme || exit 1" --health-interval=10s --health-timeout=5s --health-retries=20'
      kibana:
        image: docker.elastic.co/kibana/kibana:8.10.1
        ports:
          - 5601:5601
        env:
          ELASTICSEARCH_HOSTS: 'https://elasticsearch:9200'
          ELASTICSEARCH_USERNAME: 'ghactions'
          ELASTICSEARCH_PASSWORD: 'changeme'
        options: '--health-cmd="curl -k -f https://localhost:5601/api/status || exit 1" --health-interval=10s --health-timeout=5s --health-retries=20'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Cache pip dependencies (if needed)
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y scrot

    - name: Create config.py
      run: |
        cat <<EOF > config.py
        import os
        OPENAI_API_KEY = "${{ secrets.OPENAI_API_KEY }}"
        MODELS_CONFIG_LIST = {
            "code_gpt": "gpt-4o-mini-2024-07-18",
            "smart_gpt": "gpt-4o-mini-2024-07-18",
            "basic_gpt": "gpt-4o-mini-2024-07-18"
            }
        openai_api_key = OPENAI_API_KEY
        os.environ['OPENAI_API_KEY'] = OPENAI_API_KEY
        elastic_url_port = 'https://localhost:9200'
        kibana_url_port = 'https://localhost:5601'
        elastic_user='ghactions'
        elastic_password='changeme'
        PickleCacheActivated = False
        EOF

    - name: Wait for Elasticsearch to be ready
      run: |
        for i in {1..30}; do
          if curl -k -u elastic:changeme -s https://localhost:9200 >/dev/null; then
            echo "Elasticsearch is up!"
            break
          else
            echo "Waiting for Elasticsearch to start..."
            sleep 10
          fi
        done

    - name: Wait for Kibana to be ready
      run: |
        for i in {1..30}; do
          if curl -k -s https://localhost:5601/api/status | grep -q '"state":"available"'; then
            echo "Kibana is up!"
            break
          else
            echo "Waiting for Kibana to start..."
            sleep 10
          fi
        done


    - name: Run Selenium script and capture logs
      run: |
        nohup python learn.py > learn_logs.txt

    - name: Execute run_multi.sh and capture logs
      run: |
        bash run_multi.sh optuna_opti_Synthesis_coder GPT4 &
        sleep 120
        kill $!

    - name: Collect and Upload logs
      run: |
        mkdir -p logs_and_screenshots
        cp logs/*.log logs_and_screenshots/ || true
        cp screenshots/*.png logs_and_screenshots/ || true

    - name: Upload logs and screenshots
      uses: actions/upload-artifact@v3
      with:
        name: logs-and-screenshots
        path: logs_and_screenshots

    - name: Logs of learn.py execution
      if: always()
      run: |
        cat learn_logs.txt
