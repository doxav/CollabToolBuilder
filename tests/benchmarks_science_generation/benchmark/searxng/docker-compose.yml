version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng      # RW by default
    environment:
      BASE_URL: "http://localhost:8080/"
      INSTANCE_NAME: "my-instance"

