model_list:
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OPENROUTER_API_BASE

  - model_name: "ollama/*"
    litellm_params:
      model: "ollama/*"
      api_base: "http://localhost:11434"

litellm_settings:
  callbacks: backend.ext.litellm_middleware.custom_callbacks.proxy_handler_instance

general_settings:
  enforce_user_param: true
